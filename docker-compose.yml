# One-command start:  docker compose up --build
# Laid out like the Workshop 6 lab compose file, plus a named volume so saved
# word lists and activities survive container restarts and rebuilds.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: phoneme-activity-builder
    container_name: phoneme-activity-builder
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/app.db
    volumes:
      - phoneme-data:/app/data
    restart: unless-stopped

volumes:
  phoneme-data:
