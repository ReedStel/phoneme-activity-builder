# One-command start:  docker compose up --build
# The database lives in a named volume, so saved word lists and activities
# survive container restarts and rebuilds.
services:
  app:
    build: .
    image: phoneme-activity-builder
    container_name: phoneme-activity-builder
    ports:
      - "3000:3000"
    volumes:
      - phoneme-data:/app/data
    restart: unless-stopped

volumes:
  phoneme-data:
